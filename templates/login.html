{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card-uni p-4">
            <div class="text-center mb-4">
                <span class="badge bg-danger bg-opacity-10 text-danger px-3 py-2 rounded-pill fw-semibold mb-2">
                    <i class="bi bi-shield-lock-fill me-1"></i> Secure Assessment Portal
                </span>
                <h3 class="fw-bold text-dark mt-2 mb-1">Student & Faculty Sign In</h3>
                <p class="text-muted small">Enter your institutional credentials to proceed</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" name="email" class="form-control border-start-0" required placeholder="alice@exam.com">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn btn-uni-red w-100 py-2 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Exam
                </button>
            </form>

            <div class="pt-3 border-top small bg-light p-3 rounded">
                <div class="fw-bold text-secondary mb-1">Demo Presentation Accounts:</div>
                <div class="d-flex justify-content-between text-muted">
                    <span>Student Alice:</span> <code>alice@exam.com</code>
                </div>
                <div class="d-flex justify-content-between text-muted">
                    <span>Student Bob:</span> <code>bob@exam.com</code>
                </div>
                <div class="d-flex justify-content-between text-muted">
                    <span>Faculty Admin:</span> <code>teacher@exam.com</code>
