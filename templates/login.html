{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-3 fw-bold">Sign In</h3>
            <p class="text-muted text-center small mb-4">CCNA Certification Testing Platform</p>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="alice@exam.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login</button>
            </form>

            <div class="mt-4 pt-3 border-top small text-muted">
                <strong>Demo Accounts:</strong><br>
                • Student: <code>alice@exam.com</code> / <code>student123</code><br>
                • Student: <code>bob@exam.com</code> / <code>student123</code><br>
                • Teacher: <code>teacher@exam.com</code> / <code>admin123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
