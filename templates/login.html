{% extends 'base.html' %}

{% block title %}Sign In - Universität Liechtenstein{% endblock %}

{% block extra_head %}
<style>
    /* Full-screen campus background with subtle dark overlay */
    body {
        background: linear-gradient(rgba(18, 18, 18, 0.45), rgba(18, 18, 18, 0.55)),
                    url("{{ url_for('static', filename='images/campus.jpg') }}") no-repeat center center fixed;
        background-size: cover;
    }
    .login-card {
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.8);
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 78vh;">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card login-card shadow-lg p-4 p-md-5 rounded-3">
            <div class="text-center mb-4">
                <div style="width: 48px; height: 48px; background: #b8241b; margin: 0 auto 12px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px;">
                    LI
                </div>
                <h4 class="fw-bold mb-1" style="color: #111;">CCNA ExamGuard</h4>
                <p class="text-muted small">Information Systems & Networking Assessment</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold small">University Email</label>
                    <input 
                        type="email" 
                        class="form-control" 
                        id="email" 
                        name="email" 
                        placeholder="name@uni.li or alice@exam.com" 
                        required 
                        autofocus
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold small">Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    Sign In to Assessment
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <span class="text-muted small d-block mb-2">Quick Demo Accounts:</span>
                <div class="btn-group btn-group-sm w-100">
                    <button type="button" class="btn btn-outline-secondary" onclick="fillCredentials('alice@exam.com', 'student123')">Alice</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="fillCredentials('bob@exam.com', 'student123')">Bob</button>
                    <button type="button" class="btn btn-outline-danger" onclick="fillCredentials('teacher@exam.com', 'admin123')">Teacher</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCredentials(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
